name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Signed revision reachable from main
        required: false
        type: string
      retry_blocked:
        description: Retry a blocked revision
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: instabot-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Run precommit
        run: nix develop -c mix setup && nix develop -c mix precommit

      - name: Check flake
        run: nix flake check

      - name: Build production release
        run: nix build .#packages.x86_64-linux.default --no-link

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Scan dependencies
        run: nix run nixpkgs#osv-scanner -- scan source --format json --output osv-report.json . || test -s osv-report.json

      - name: Enforce advisory baseline
        run: python3 .github/scripts/check-advisory-baseline.py osv-report.json .github/advisory-baseline.json

  deploy:
    needs: [validate, dependencies]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Connect to tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-instabot-production

      - name: Deploy signed revision
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_REVISION: ${{ inputs.revision }}
          RETRY_BLOCKED: ${{ inputs.retry_blocked }}
        run: |
          set -euo pipefail
          if ! ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new prominent-deploy@symphony true >/dev/null 2>&1; then
            echo "Symphony is unreachable; daily reconciliation will retry"
            exit 0
          fi
          target_revision="${MANUAL_REVISION:-${GITHUB_SHA}}"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            target_revision="$(git rev-parse origin/main)"
          else
            target_revision="$(git rev-parse "${target_revision}^{commit}")"
          fi
          deployment_phase="authentication"
          notify_failure() {
            exit_status="$?"
            trap - ERR
            ssh -o StrictHostKeyChecking=accept-new prominent-deploy@symphony sudo /run/current-system/sw/bin/prominent-tools-activate instabot notify "$target_revision" "$deployment_phase" "Instabot deployment failed during $deployment_phase" || true
            exit "$exit_status"
          }
          trap notify_failure ERR
          git merge-base --is-ancestor "$target_revision" origin/main
          verification="$(curl --fail --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${target_revision}" | jq --raw-output '.commit.verification.verified')"
          [[ "$verification" == "true" ]]
          retry_mode="normal"
          if [[ "$RETRY_BLOCKED" == "true" ]]; then
            retry_mode="force"
          fi
          if ssh -o StrictHostKeyChecking=accept-new prominent-deploy@symphony sudo /run/current-system/sw/bin/prominent-tools-activate instabot status "$target_revision" "$retry_mode"; then
            status_result=0
          else
            status_result="$?"
          fi
          if [[ "$status_result" == 10 ]]; then
            trap - ERR
            exit 0
          fi
          [[ "$status_result" == 0 ]]
          deployment_phase="build"
          ssh -o StrictHostKeyChecking=accept-new prominent-deploy@symphony prominent-tools-deploy instabot "$target_revision"
          trap - ERR
